name: Deploy to GitHub Pages

# Publishes the app to the gh-pages branch on every push, which GitHub serves at
# https://<user>.github.io/<repo>/ . If the site does not appear, open the repository
# Settings -> Pages and choose "Deploy from a branch" -> gh-pages / (root).
on:
  push:
    branches: [ main, claude/guitar-fingerpicking-hymns-app-nv2dod ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/sw.js
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
